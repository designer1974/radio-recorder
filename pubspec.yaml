name: radio_recorder
description: Registratore audio avanzato - audio interno ed esterno, riduzione rumore, gestione e condivisione delle registrazioni.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  shared_preferences: ^2.3.2
  whisper_ggml: any
  google_mlkit_language_id: any
  google_mlkit_translation: any
  scrollable_positioned_list: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
