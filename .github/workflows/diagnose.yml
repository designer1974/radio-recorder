name: Diagnosi

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Installa NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13113456" > /dev/null
      - name: Prepara
        run: |
          flutter create --platforms=android --org com.designer1974 --project-name radio_recorder .
          rm -f test/widget_test.dart
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i -E 's/minSdk( =|Version)? *flutter\.minSdkVersion/minSdk = 29/' "$f" || true
          done
          flutter pub get
          echo "::notice title=Versioni::$(flutter pub deps --style=compact | grep -E 'mlkit|whisper|ffmpeg|share_plus|audioplayers' | tr '\n' ' ')"
          echo "::notice title=Gradle::$(grep -nE 'minify|shrink|proguard|signingConfig' android/app/build.gradle* | tr '\n' ' ')"
      - name: Compila (x86_64 per emulatore)
        run: flutter build apk --release --target-platform android-x64 > out.txt 2>&1 || { tail -30 out.txt; exit 1; }
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Avvia app su emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am start -n com.designer1974.radio_recorder/.MainActivity
            sleep 25
            adb logcat -d > logcat.txt
            echo "::notice title=Plugin::$(grep -iE 'GeneratedPluginRegistrant|Error registering|MissingPlugin|mlkit|translat|FATAL|AndroidRuntime' logcat.txt | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::notice title=Eccezioni::$(grep -iE -A6 'Exception|Caused by' logcat.txt | grep -v 'chatty' | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
